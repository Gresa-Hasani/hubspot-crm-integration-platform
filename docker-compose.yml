services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_integration}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm_user} -d ${POSTGRES_DB:-crm_integration}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-crm_integration};Username=${POSTGRES_USER:-crm_user};Password=${POSTGRES_PASSWORD:-change-me-locally}
      HubSpot__BaseUrl: ${HubSpot__BaseUrl:-https://api.hubapi.com}
      HubSpot__AccessToken: ${HubSpot__AccessToken:-}
      HubSpot__WebhookSigningSecret: ${HubSpot__WebhookSigningSecret:-}
      Jwt__Issuer: ${Jwt__Issuer:-CrmIntegrationPlatform}
      Jwt__Audience: ${Jwt__Audience:-CrmIntegrationPlatformClients}
      Jwt__SigningKey: ${Jwt__SigningKey:-replace-with-a-long-random-signing-key-at-least-32-bytes}

volumes:
  postgres-data:
